<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px; max-width: 100vw; padding: 16px;
      background: #09090b; color: #fafafa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #27272a; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; }
    .badge { background: rgba(244,63,94,0.15); color: #fb7185; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; font-family: monospace; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 10px 8px; text-align: center; }
    .val { font-size: 18px; font-weight: 900; font-family: monospace; }
    .lbl { font-size: 10px; color: #a1a1aa; margin-top: 2px; }
    .sec-title { font-size: 11px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 6px; }
    .pause-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .btn-sm { min-height: 48px; min-width: 48px; background: #18181b; border: 1px solid #27272a; color: #e4e4e7; padding: 7px 4px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-sm:hover { border-color: #f43f5e; color: #fb7185; }
    .site-box { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .site-name { font-family: monospace; font-size: 12px; font-weight: 700; color: #fb7185; overflow: hidden; text-overflow: ellipsis; }
    .btn-toggle { min-height: 48px; background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-main { width: 100%; min-height: 48px; padding: 10px; border-radius: 10px; border: none; background: #e11d48; color: #fff; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 6px; }
    .btn-sec { width: 100%; min-height: 48px; padding: 8px; border-radius: 10px; border: 1px solid #27272a; background: #18181b; color: #d4d4d8; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand"><span>🌿</span> WATTIM × GFW</div>
    <div class="badge" id="statusBadge">АКТИВЕН</div>
  </div>

  <div class="stats">
    <div class="card">
      <div class="val" style="color:#34d399" id="savedCount">0</div>
      <div class="lbl">Отбито</div>
    </div>
    <div class="card">
      <div class="val" style="color:#38bdf8" id="savedMinutes">0м</div>
      <div class="lbl">Сбережено</div>
    </div>
    <div class="card">
      <div class="val" style="color:#fbbf24" id="enteredCount">0</div>
      <div class="lbl">Входов</div>
    </div>
  </div>

  <div class="site-box">
    <span class="site-name" id="currentHost">вкладка...</span>
    <button class="btn-toggle" id="btnToggleDomain">+ Под надзор</button>
  </div>

  <div class="sec-title">Быстрая пауза защиты (wattim):</div>
  <div class="pause-grid">
    <button class="btn-sm pause-btn" data-m="15">15 мин</button>
    <button class="btn-sm pause-btn" data-m="30">30 мин</button>
    <button class="btn-sm pause-btn" data-m="60">1 час</button>
    <button class="btn-sm pause-btn" data-m="0" style="color:#34d399">▶ Вкл</button>
  </div>

  <button class="btn-sec" id="openOptionsBtn">⚙️ Открыть полную панель настроек</button>
  <script src="popup.js"></script>
</body>
</html>
